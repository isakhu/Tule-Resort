<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B3D4A">
  <title>You're offline · Tule Resort</title>
  <style>
    :root{color-scheme:light;background:#F8F5EE;color:#182326;font-family:Arial,sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:440px;text-align:center;background:white;border:1px solid #0B3D4A18;border-radius:24px;padding:32px;box-shadow:0 18px 55px #0B3D4A12}
    img{width:88px;height:70px;object-fit:contain}
    h1{font-size:1.8rem;margin:18px 0 10px;color:#0B3D4A}
    p{line-height:1.65;color:#526064}
    button{margin-top:12px;background:#0B3D4A;color:white;border:0;border-radius:999px;padding:12px 20px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/tule-resort-mark.svg" alt="Tule Resort">
    <h1>You're temporarily offline</h1>
    <p>We couldn't connect to Tule Resort. Please check your internet connection and try again. Orders and reservations are not submitted while this page is shown.</p>
    <button onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
