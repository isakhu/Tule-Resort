name: Validate Tule Resort

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - upgrade/cinematic-resort-experience
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update patched Next.js dependencies
        run: npm install --package-lock-only --save-exact next@16.4.6 eslint-config-next@16.4.6

      - name: Refresh patched transitive dependencies
        run: |
          npm pkg set 'overrides.minimatch=11.0.1'
          npm audit fix --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const a = require('./npm-audit-report.json'); console.log('Dependency audit counts:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) { const via = v.via.map(x => typeof x === 'string' ? x : x.title || x.name); console.log(name + ' | ' + v.severity + ' | direct=' + v.isDirect + ' | fix=' + JSON.stringify(v.fixAvailable) + ' | ' + via.join('; ')); }"

      - name: Upload patched dependency files
        uses: actions/upload-artifact@v4
        with:
          name: patched-dependency-files
          path: |
            package.json
            package-lock.json
            npm-audit-report.json
          if-no-files-found: error

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key

      - name: Commit validated dependency updates
        if: success()
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency updates to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): patch Next.js and minimatch advisories"
          git push origin HEAD:master
